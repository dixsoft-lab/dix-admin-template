name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-consumer:
    name: source-and-consumer (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20.19.0
            npm: 10.8.0
          - node: 24.21.0
            npm: 11.19.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: npm 버전과 clean install
        run: |
          npm install --global npm@${{ matrix.npm }}
          npm ci
          mkdir -p "$RUNNER_TEMP/dix-admin-quality"
      - name: 타입·동작·build 검증
        shell: bash
        run: |
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/dix-admin-quality/typecheck.log"
          npm test -- --run 2>&1 | tee "$RUNNER_TEMP/dix-admin-quality/test.log"
          npm run build 2>&1 | tee "$RUNNER_TEMP/dix-admin-quality/build.log"
      - name: Source·route·provider·consumer 계약 검증
        shell: bash
        run: |
          for gate in template-layout template-contracts template-domain-boundary template-architecture template-routes design-system-modes consumer-modes consumer-docs agent-docs skills; do
            if [[ "$gate" == "consumer-modes" ]]; then
              CONSUMER_EVIDENCE_DIR="$RUNNER_TEMP/dix-admin-quality/consumer" npm run "verify:$gate" 2>&1 | tee "$RUNNER_TEMP/dix-admin-quality/$gate.log"
            elif [[ "$gate" == "consumer-docs" ]]; then
              CONSUMER_DOCS_EVIDENCE_DIR="$RUNNER_TEMP/dix-admin-quality/consumer-docs" npm run "verify:$gate" 2>&1 | tee "$RUNNER_TEMP/dix-admin-quality/$gate.log"
            else
              npm run "verify:$gate" 2>&1 | tee "$RUNNER_TEMP/dix-admin-quality/$gate.log"
            fi
          done
      - name: Source mutation이 실제로 거부되는지 검증
        shell: bash
        run: |
          while IFS='|' read -r gate fixture diagnostic; do
            set +e
            npm run "verify:$gate" -- "--fixture=$fixture" > "$RUNNER_TEMP/dix-admin-quality/$fixture.log" 2>&1
            status=$?
            set -e
            cat "$RUNNER_TEMP/dix-admin-quality/$fixture.log"
            test "$status" -eq 1
            grep -F -- "$diagnostic" "$RUNNER_TEMP/dix-admin-quality/$fixture.log"
          done <<'SCENARIO'
          template-domain-boundary|retained-domain-prop|제품 Domain 식별자 storyId
          template-domain-boundary|backend-import|제품 backend/telemetry 의존성 firebase/auth
          template-architecture|role-violation|책임 방향 위반: component → layout
          template-architecture|deep-import|공개 index.ts 우회
          template-architecture|relative-boundary|@admin 공개 API
          template-architecture|cross-module|모듈 경계에서는 @admin 공개 API
          template-routes|constant-without-registration|현재 0회
          template-routes|duplicate-raw-path|중복 raw route /item
          template-routes|basename-in-route-path|mount basename
          template-routes|registration-not-connected|등록 연결 단절
          template-routes|raw-href|중복 raw href /item
          SCENARIO
      # skills@1.7.4 uses fs/promises.glob, which requires Node.js 22.20.0 or newer.
      # Keep the product runtime gate on Node 20.19.0, then switch only this tooling check.
      - name: Node.js 22.20 for Skills CLI on the Node 20 matrix
        if: matrix.node == '20.19.0'
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Agent Kit 설치 검증
        shell: bash
        run: npm run verify:agent-kit-install 2>&1 | tee "$RUNNER_TEMP/dix-admin-quality/agent-kit-install.log"
        env:
          DIX_AGENT_KIT_EVIDENCE_DIR: ${{ runner.temp }}/dix-admin-quality/agent-kit
      # 이 hosted job은 browser UI·network 증거를 제공하지 않는다.
      # OmO built-in browser를 제공하는 실행 환경이 준비되면 별도 browser gate를 연결한다.
      - name: 검증 artifact 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-node-${{ matrix.node }}
          path: ${{ runner.temp }}/dix-admin-quality
          if-no-files-found: error
          retention-days: 7
